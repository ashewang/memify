version: "3.9"

services:
  frontend:
    image: node:20-bullseye
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./web/.env.example
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - API_BASE_URL=http://api:8080
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  api:
    image: golang:1.23
    working_dir: /app
    command: sh -c "go run ./cmd/api"
    environment:
      - APP_ENV=development
      - API_PORT=8080
      - API_ALLOWED_ORIGINS=http://localhost:3000
      - PYTHON_SERVICE_URL=http://ai:8000
      - DATABASE_URL=postgres://memify:memify@postgres:5432/memify?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    depends_on:
      - postgres
      - ai

  ai:
    build:
      context: ./services/ai
    env_file:
      - ./services/ai/.env.example
    environment:
      - AI_ALLOWED_ORIGINS=http://localhost:3000,http://api:8080
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai/app:/app/app

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=memify
      - POSTGRES_PASSWORD=memify
      - POSTGRES_DB=memify
    ports:
      - "5432:5432"
    volumes:
      - memify-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - memify-redis-data:/data

volumes:
  memify-postgres-data:
  memify-redis-data:
